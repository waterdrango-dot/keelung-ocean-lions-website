<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歷屆會長 · 基隆海洋獅子會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;900&family=Noto+Serif+TC:wght@500;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .filter-bar {
    display: flex; gap: var(--s-3); flex-wrap: wrap;
    padding: var(--s-5) 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: var(--s-7);
    align-items: center;
  }
  .filter-bar__label {
    font-family: var(--font-en); font-size: 12px; letter-spacing: 0.2em;
    color: var(--ink-500); text-transform: uppercase; margin-right: var(--s-3);
  }
  .filter-chip {
    padding: 8px 18px; border: 1px solid var(--line); background: white;
    color: var(--ink-700); font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all .25s var(--ease); border-radius: 2px;
    font-family: var(--font-zh);
  }
  .filter-chip:hover { border-color: var(--ocean-deep); color: var(--ocean-deep); }
  .filter-chip.is-active { background: var(--ocean-deep); color: white; border-color: var(--ocean-deep); }
  .filter-bar__count {
    margin-left: auto; font-family: var(--font-en); font-size: 13px; color: var(--ink-500); letter-spacing: 0.08em;
  }

  .pres-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-5);
  }
  @media(max-width: 1080px){ .pres-grid { grid-template-columns: repeat(3,1fr); } }
  @media(max-width: 760px){ .pres-grid { grid-template-columns: repeat(2,1fr); } }
  @media(max-width: 480px){ .pres-grid { grid-template-columns: 1fr; } }

  .p-card {
    background: white; border: 1px solid var(--line); position: relative; overflow: hidden;
    transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
    cursor: pointer;
  }
  .p-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 28px 56px -28px rgba(7,55,99,0.4);
    border-color: var(--lion-gold);
  }
  .p-card__photo {
    aspect-ratio: 4/5;
    background: linear-gradient(160deg, #0B5394 0%, #073763 100%);
    display: grid; place-items: center;
    position: relative;
  }
  .p-card__photo::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at top, rgba(212,160,21,0.3), transparent 60%);
  }
  .p-card__initial {
    font-family: var(--font-serif); font-size: 100px; color: rgba(255,248,225,0.85);
    font-weight: 700;
    text-shadow: 0 4px 24px rgba(0,0,0,0.4);
    z-index: 1;
  }
  .p-card__charter {
    position: absolute; top: 12px; right: 12px;
    background: linear-gradient(135deg, #d4a015, #B45F06);
    color: white; padding: 4px 10px;
    font-size: 11px; letter-spacing: 0.08em;
    font-family: var(--font-zh); font-weight: 600;
    z-index: 2;
    box-shadow: 0 4px 12px rgba(180,95,6,0.4);
  }
  .p-card__charter::before {
    content: "★"; margin-right: 4px;
  }
  .detail-facts {
    list-style: none; padding: 0; margin: 0 0 var(--s-5);
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 0;
    border-top: 1px solid var(--line);
  }
  .detail-facts > div {
    padding: var(--s-3) 0;
    border-bottom: 1px solid var(--line);
  }
  .detail-facts > div:nth-child(odd) { padding-right: var(--s-4); border-right: 1px solid var(--line); }
  .detail-facts > div:nth-child(even) { padding-left: var(--s-4); }
  .detail-facts dt {
    font-family: var(--font-en); font-size: 10px; letter-spacing: 0.2em;
    color: var(--ink-500); text-transform: uppercase; margin-bottom: 4px;
  }
  .detail-facts dd {
    font-size: 15px; color: var(--sea-ink); font-weight: 500; margin: 0;
  }
  .detail-pending {
    background: var(--sand-gold); border-left: 3px solid var(--lion-gold);
    padding: var(--s-4); margin-top: var(--s-5);
  }
  .detail-pending__label {
    font-family: var(--font-en); font-size: 11px; letter-spacing: 0.2em;
    color: var(--lion-gold); text-transform: uppercase; font-weight: 600;
    margin-bottom: 8px;
  }
  .detail-pending p {
    margin: 0; font-size: 14px; color: var(--ink-700); line-height: 1.7;
  }
  .p-card__term-badge {
    position: absolute; bottom: -1px; left: var(--s-4);
    background: var(--lion-gold); color: white; padding: 4px 12px;
    font-family: var(--font-en); font-size: 12px; letter-spacing: 0.16em; font-weight: 700;
    z-index: 2;
  }
  .p-card__body { padding: var(--s-5) var(--s-4) var(--s-4); }
  .p-card__yr {
    font-family: var(--font-en); font-size: 12px; letter-spacing: 0.16em;
    color: var(--ink-500); margin-bottom: 4px;
  }
  .p-card__name {
    font-size: 18px; font-weight: 700; color: var(--sea-ink); margin-bottom: 4px;
  }
  .p-card__title {
    font-size: 13px; color: var(--ink-500); line-height: 1.5;
  }

  /* Detail modal */
  .detail-modal {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(7,55,99,0.85);
    backdrop-filter: blur(8px);
    display: none;
    place-items: center;
    padding: var(--s-5);
    overflow-y: auto;
  }
  .detail-modal.is-open { display: grid; }
  .detail-card {
    background: white; max-width: 960px; width: 100%;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.5);
    display: grid;
    grid-template-columns: 360px 1fr;
    max-height: 90vh;
    overflow-y: auto;
  }
  @media(max-width:760px){ .detail-card { grid-template-columns: 1fr; } }
  .detail-photo {
    background: linear-gradient(160deg, #0B5394, #073763);
    display: grid; place-items: center;
    color: rgba(255,248,225,0.9);
    font-family: var(--font-serif);
    font-size: 160px; font-weight: 700;
    aspect-ratio: 1;
    position: relative;
  }
  .detail-photo::after {
    content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--lion-gold), var(--lion-gold-soft));
  }
  .detail-body { padding: var(--s-7); position: relative; }
  .detail-close {
    position: absolute; top: var(--s-4); right: var(--s-4);
    width: 36px; height: 36px;
    border: 1px solid var(--line); background: white;
    cursor: pointer; display: grid; place-items: center;
    border-radius: 50%; transition: all .2s;
    color: var(--ink-700);
    font-size: 20px;
  }
  .detail-close:hover { border-color: var(--lion-gold); color: var(--lion-gold); }
  .detail-term { font-family: var(--font-en); font-size: 13px; letter-spacing: 0.2em; color: var(--lion-gold); font-weight: 600; }
  .detail-name { font-size: 32px; font-weight: 700; color: var(--sea-ink); margin: 8px 0 4px; }
  .detail-yrs { font-family: var(--font-en); font-size: 14px; color: var(--ink-500); letter-spacing: 0.1em; margin-bottom: var(--s-4); }
  .detail-bio { color: var(--ink-700); line-height: 1.85; font-size: 15px; margin-bottom: var(--s-5); }
  .detail-section-h { font-family: var(--font-en); font-size: 11px; letter-spacing: 0.28em; color: var(--lion-gold); text-transform: uppercase; font-weight: 600; margin-bottom: var(--s-3); border-top: 1px solid var(--line); padding-top: var(--s-4); }
  .detail-achievements { list-style: none; padding: 0; margin: 0 0 var(--s-5); display: grid; gap: var(--s-3); }
  .detail-achievements li {
    padding-left: 28px; position: relative;
    font-size: 14px; color: var(--ink-700); line-height: 1.7;
  }
  .detail-achievements li::before {
    content: "◆"; position: absolute; left: 0; top: 0;
    color: var(--lion-gold);
  }
  .detail-quote {
    border-left: 3px solid var(--lion-gold);
    padding: var(--s-3) var(--s-4);
    background: var(--sand-gold);
    font-family: var(--font-serif);
    font-style: italic; font-size: 17px;
    color: var(--sea-ink); line-height: 1.7;
    margin-top: var(--s-4);
  }
  .detail-honor {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #d4a015, #B45F06); color: white;
    padding: 8px 14px; font-size: 12px; letter-spacing: 0.16em;
    font-family: var(--font-en); font-weight: 700;
    margin-top: var(--s-3);
  }
</style>
</head>
<body data-page="presidents">
<div id="site-nav"></div>

<section class="page-hero">
  <div class="container page-hero__inner">
    <div class="breadcrumb"><a href="index.html">HOME</a> / <span>PAST PRESIDENTS</span></div>
    <span class="eyebrow on-dark">歷屆會長 · LEGACY</span>
    <h1>三十六屆會長 · 一脈相承的浪潮</h1>
    <p class="lede">自 1991 年創會以來，三十六屆會長傳承不輟，於這片海洋裡留下獨特的浪痕。</p>
    <p class="lede" style="font-size:14px; opacity:0.85; margin-top:10px; color: var(--lion-gold-soft);">本會為國際獅子會 300A5 區・第一專區 14 個姊妹分會之一</p>
    <p class="lede" style="font-size:13px; opacity:0.7; margin-top:8px;">資料來源：基隆海洋獅子會歷屆會長名錄 · 民國 110 年 4 月 22 日修訂</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="filter-bar">
      <span class="filter-bar__label">FILTER · 屆別</span>
      <button class="filter-chip is-active" data-decade="all">全部會長</button>
      <button class="filter-chip" data-decade="1">第 1 - 10 屆</button>
      <button class="filter-chip" data-decade="2">第 11 - 20 屆</button>
      <button class="filter-chip" data-decade="3">第 21 - 31 屆</button>
      <span class="filter-bar__count" id="resultCount">SHOWING 31 OF 31</span>
    </div>

    <div class="pres-grid" id="presGrid"></div>
  </div>
</section>

<!-- Detail modal -->
<div class="detail-modal" id="detailModal">
  <div class="detail-card" id="detailCard">

  </div>
</div>

<div id="site-footer"></div>

const TOTAL = PRESIDENTS.length;

function termDecade(term){
  if(term <= 10) return 1;
  if(term <= 20) return 2;
  return 3;
}

function renderGrid(filter){
  const grid = document.getElementById("presGrid");
  const list = filter === "all" ? PRESIDENTS : PRESIDENTS.filter(p => termDecade(p.term) === parseInt(filter));
  grid.innerHTML = list.map(p => `
    <article class="p-card" data-term="${p.term}">
      <div class="p-card__photo">
        ${p.isCharter ? '<div class="p-card__charter">授證會員</div>' : ''}
        <div class="p-card__initial">${p.surname}</div>
        <div class="p-card__term-badge">第 ${p.term} 屆${p.isFounder ? ' · 創會' : ''}</div>
      </div>
      <div class="p-card__body">
        <div class="p-card__yr">${p.years}</div>
        <div class="p-card__name">${p.name}</div>
        <div class="p-card__title">民國 ${p.rocYears} 屆期</div>
      </div>
    </article>
  `).join("");
  document.getElementById("resultCount").textContent = `SHOWING ${list.length} OF ${TOTAL}`;

  grid.querySelectorAll(".p-card").forEach(el => {
    el.addEventListener("click", () => openDetail(parseInt(el.dataset.term)));
  });
}

function openDetail(term){
  const p = PRESIDENTS.find(x => x.term === term);
  if(!p) return;
  const eraLabel = p.term <= 10 ? 'EARLY ERA · 創會初期'
                 : p.term <= 20 ? 'GROWTH ERA · 成長期'
                 : 'MATURE ERA · 成熟期';
  const card = document.getElementById("detailCard");
  card.innerHTML = `
    <div class="detail-photo">${p.surname}</div>
    <div class="detail-body">
      <button class="detail-close" id="closeDetail" aria-label="Close">×</button>
      <div class="detail-term">第 ${p.term} 屆 · ${eraLabel}</div>
      <h2 class="detail-name">${p.name}</h2>
      <div class="detail-yrs">${p.years} · 民國 ${p.rocYears} 屆期</div>
      ${p.isCharter ? '<div class="detail-honor">★ 授證會員 · CHARTER MEMBER</div>' : ''}
      ${p.isFounder ? '<div class="detail-honor" style="margin-left:8px;">★ 創會會長 · FOUNDING PRESIDENT</div>' : ''}

      <dl class="detail-facts">
        <div><dt>屆次</dt><dd>第 ${p.term} 屆</dd></div>
        <div><dt>任期</dt><dd>${p.years} (民國 ${p.rocYears})</dd></div>
        <div><dt>交接日</dt><dd>民國 ${p.transition}</dd></div>
        <div><dt>身分</dt><dd>${p.isCharter ? '授證會員' : '一般會員'}${p.isFounder ? ' · 創會會長' : ''}</dd></div>
      </dl>

      <div class="detail-pending">
        <div class="detail-pending__label">專訪、專業背景與任內記事</div>
        <p>本頁僅列出經秘書處驗證之名錄資料。專訪內容、任內公益實踐與委員會職務將由秘書處陸續彙整上線。</p>
      </div>
    </div>
  `;
  document.getElementById("detailModal").classList.add("is-open");
  document.body.style.overflow = "hidden";
  document.getElementById("closeDetail").addEventListener("click", closeDetail);
}

function closeDetail(){
  document.getElementById("detailModal").classList.remove("is-open");
  document.body.style.overflow = "";
}

document.getElementById("detailModal").addEventListener("click", (e) => {
  if(e.target.id === "detailModal") closeDetail();
});

document.querySelectorAll(".filter-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("is-active"));
    chip.classList.add("is-active");
    renderGrid(chip.dataset.decade);
  });
});

renderGrid("all");
</script>
