<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
  <title>基隆海洋獅子會 · 內容後台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%230a2540'/%3E%3Ctext x='50' y='62' text-anchor='middle' font-size='40' fill='%23d4af37' font-family='serif'%3E獅%3C/text%3E%3C/svg%3E">
</head>
<body>
  <!-- Netlify Identity Widget — 處理 Email 邀請 / 登入 / 設密碼 -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Decap CMS (前身為 Netlify CMS) -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // 收到邀請連結後，自動把使用者導回後台
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
