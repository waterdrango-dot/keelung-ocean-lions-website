# =================================================================
# Netlify 部署設定 · 基隆海洋獅子會
# =================================================================

[build]
  publish = "."

# 後台不被搜尋引擎收錄
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# 基本安全標頭
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 靜態資源長期快取（圖片、樣式、JS）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
